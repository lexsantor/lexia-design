<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 258" width="420" height="258" role="img" aria-label="Commits to a direction">
<rect width="420" height="258" fill="#0D1117"/>
<rect x="2" y="2" width="416" height="254" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <circle cx="52" cy="56" r="22" fill="none" stroke="#FF6B35" stroke-width="2.5"/>
  <path d="M 62 46 L 56 60 L 42 66 L 48 52 Z" fill="#FF6B35"/>
  <text x="32" y="112" fill="#E6EDF3" font-size="20" font-weight="700" letter-spacing="-0.3">Commits to a direction</text>
  <text x="32" y="140" fill="#8B949E" font-size="14">A contract with falsifiable</text>
  <text x="32" y="162" fill="#8B949E" font-size="14">commitments, not mood words.</text>
  <text x="32" y="184" fill="#8B949E" font-size="14">Twelve territories, each with a</text>
  <text x="32" y="206" fill="#8B949E" font-size="14">breaks-if list an audit can check.</text>
  <text x="32" y="236" fill="#FF6B35" font-size="12" font-weight="700" letter-spacing="1.5">DIRECTION CONTRACT</text>
</g>
