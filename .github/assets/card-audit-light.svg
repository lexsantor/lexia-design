<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 258" width="420" height="258" role="img" aria-label="Checks its own work">
<rect width="420" height="258" fill="#FFFFFF"/>
<rect x="2" y="2" width="416" height="254" rx="14" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

  <rect x="30" y="36" width="44" height="40" rx="8" fill="none" stroke="#E8590C" stroke-width="2.5"/>
  <line x1="38" y1="50" x2="66" y2="50" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="60" x2="58" y2="60" stroke="#57606A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="9" fill="none" stroke="#E8590C" stroke-width="2.5"/>
  <line x1="70" y1="75" x2="78" y2="83" stroke="#E8590C" stroke-width="2.5" stroke-linecap="round"/>
  <text x="32" y="112" fill="#1F2328" font-size="20" font-weight="700" letter-spacing="-0.3">Checks its own work</text>
  <text x="32" y="140" fill="#57606A" font-size="14">72 deterministic rules plus</text>
  <text x="32" y="162" fill="#57606A" font-size="14">fresh-context reviewers in</text>
  <text x="32" y="184" fill="#57606A" font-size="14">isolated tracks. Every finding</text>
  <text x="32" y="206" fill="#57606A" font-size="14">verified before it is acted on.</text>
  <text x="32" y="236" fill="#E8590C" font-size="12" font-weight="700" letter-spacing="1.5">DETECTOR + REVIEWERS</text>
</g>
</svg>