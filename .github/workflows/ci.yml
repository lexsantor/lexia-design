name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: |
          node --check scripts/lexia-design-audit.mjs
          node --check scripts/lexia-design-score.mjs
          node --check scripts/lexia-design-update.mjs
          node --check evals/run-evals.mjs
      - name: Offline smoke suite (cases + detector self-test)
        run: node evals/run-evals.mjs --smoke
      - name: Landing page passes its own detector (0 findings)
        run: |
          node -e "
            const { execFileSync } = require('child_process');
            const out = execFileSync(process.execPath, ['scripts/lexia-design-audit.mjs', 'docs/index.html', '--format', 'json'], { encoding: 'utf8' });
            const n = JSON.parse(out).findings.length;
            if (n > 0) { console.error(out); throw new Error(n + ' finding(s) on docs/index.html'); }
            console.log('docs/index.html: 0 findings');
          "
      - name: JSON manifests parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('sources.lock.json','utf8'))"
      # `claude plugin validate` needs the Claude Code CLI, which is not
      # installed on runners by default; run it locally before releases.
